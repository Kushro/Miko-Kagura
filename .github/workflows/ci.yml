name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Weekly run keeps the main-branch Rust caches from expiring between releases.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    uses: ./.github/workflows/runner.yml

  test:
    needs: runner
    runs-on: ${{ needs.runner.outputs.windows }}
    timeout-minutes: 45
    # Must match the test job in release.yml so the shared cache key matches.
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { throw 'Could not install pinned Rust toolchain.' }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests
        run: |
          cargo test --locked --config "profile.dev.package.'*'.opt-level=0"
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed.' }

  # Builds the release binary on main so release.yml restores a warm cache.
  warm-release:
    if: github.event_name != 'pull_request'
    needs: runner
    runs-on: ${{ needs.runner.outputs.windows }}
    timeout-minutes: 45
    # Must match the windows job in release.yml so the shared cache key matches.
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { throw 'Could not install pinned Rust toolchain.' }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Build Tailwind
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'bun install failed.' }
          bun run tailwind:build
          if ($LASTEXITCODE -ne 0) { throw 'Tailwind build failed.' }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Dioxus CLI 0.7.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'dioxus-cli'
          New-Item -ItemType Directory -Force $tools | Out-Null
          gh release download v0.7.9 --repo DioxusLabs/dioxus --pattern dx-x86_64-pc-windows-msvc.zip --pattern dx-x86_64-pc-windows-msvc.sha256 --dir $tools
          if ($LASTEXITCODE -ne 0) { throw 'Dioxus download failed.' }
          $zip = Join-Path $tools 'dx-x86_64-pc-windows-msvc.zip'
          $expected = ((Get-Content "$tools/dx-x86_64-pc-windows-msvc.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $zip).Hash -ine $expected) { throw 'Dioxus checksum mismatch.' }
          Expand-Archive $zip "$tools/bin"
          $dx = @(Get-ChildItem "$tools/bin" -Recurse -Filter dx.exe)
          if ($dx.Count -ne 1) { throw 'Unexpected Dioxus archive layout.' }
          $dx[0].DirectoryName >> $env:GITHUB_PATH
      # Same invocation as scripts/build-release.ps1.
      - name: Build release binary
        run: |
          dx build --platform desktop --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'dx build failed.' }

  # Linux counterpart of warm-release: catches Linux-only build breaks on main
  # and saves the cache that the linux job in release.yml restores.
  warm-release-linux:
    if: github.event_name != 'pull_request'
    needs: runner
    runs-on: ${{ needs.runner.outputs.linux }}
    timeout-minutes: 45
    # Must match the linux job in release.yml so the shared cache key matches.
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file jq unzip dpkg-dev patchelf libvulkan1 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Set up Rust
        run: rustup show
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Build Tailwind
        run: |
          bun install --frozen-lockfile
          bun run tailwind:build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Dioxus CLI 0.7.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools="$RUNNER_TEMP/dioxus-cli"
          mkdir -p "$tools/bin"
          gh release download v0.7.9 --repo DioxusLabs/dioxus --pattern dx-x86_64-unknown-linux-gnu.zip --pattern dx-x86_64-unknown-linux-gnu.sha256 --dir "$tools"
          # The .sha256 lists both the .tar.gz and the .zip; only the zip was downloaded.
          (cd "$tools" && sha256sum -c --ignore-missing --strict dx-x86_64-unknown-linux-gnu.sha256)
          unzip -q "$tools/dx-x86_64-unknown-linux-gnu.zip" -d "$tools/bin"
          dx=$(find "$tools/bin" -type f -name dx)
          [ "$(wc -l <<<"$dx")" = 1 ] || { echo 'Unexpected Dioxus archive layout.'; exit 1; }
          chmod +x "$dx"
          dirname "$dx" >> "$GITHUB_PATH"
      # Same invocation as scripts/build-release-linux.sh.
      - name: Build release binary
        run: dx build --platform desktop --release --locked
