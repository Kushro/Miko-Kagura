name: Release Windows packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to validate, e.g. v0.1.0 (build only; does not publish)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id || inputs.tag }}
  cancel-in-progress: false

jobs:
  runner:
    # Every other job needs this one, so skipping it skips the whole release.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/runner.yml

  test:
    needs: runner
    runs-on: ${{ needs.runner.outputs.windows }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { throw 'Could not install pinned Rust toolchain.' }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-test
          save-if: false
      # Tests do not need optimized dependencies; release packaging keeps its own profile.
      - name: Run tests
        run: |
          cargo test --locked --config "profile.dev.package.'*'.opt-level=0"
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed.' }

  windows:
    needs: runner
    runs-on: ${{ needs.runner.outputs.windows }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject immutable releases before building
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          $release = gh api "repos/$env:GH_REPO/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read release.' }
          if ($release.immutable) { throw 'Published immutable releases cannot accept new assets.' }
      - name: Set up Rust
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { throw 'Could not install pinned Rust toolchain.' }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Validate version and documentation
        run: |
          . ./scripts/release-common.ps1
          Get-ReleaseVersion $env:RELEASE_TAG
          bun run docs:check
          Assert-NativeSuccess 'Documentation checks'
      # Restores the cache that ci.yml (warm-release) saves from main; never saves here.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-release
          save-if: false
      - name: Install Dioxus CLI 0.7.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'dioxus-cli'
          New-Item -ItemType Directory -Force $tools | Out-Null
          gh release download v0.7.9 --repo DioxusLabs/dioxus --pattern dx-x86_64-pc-windows-msvc.zip --pattern dx-x86_64-pc-windows-msvc.sha256 --dir $tools
          if ($LASTEXITCODE -ne 0) { throw 'Dioxus download failed.' }
          $zip = Join-Path $tools 'dx-x86_64-pc-windows-msvc.zip'
          $expected = ((Get-Content "$tools/dx-x86_64-pc-windows-msvc.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $zip).Hash -ine $expected) { throw 'Dioxus checksum mismatch.' }
          Expand-Archive $zip "$tools/bin"
          $dx = @(Get-ChildItem "$tools/bin" -Recurse -Filter dx.exe)
          if ($dx.Count -ne 1) { throw 'Unexpected Dioxus archive layout.' }
          $dx[0].DirectoryName >> $env:GITHUB_PATH
      - name: Build Lite and Full packages
        # Tests run in the parallel test job; publish requires both jobs.
        run: ./scripts/build-release.ps1 -Tag $env:RELEASE_TAG -SkipTests
      - name: Test installation and variant upgrades
        run: ./scripts/test-installers.ps1 -Tag $env:RELEASE_TAG
      - name: Retain packages for inspection and upload retries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-${{ env.RELEASE_TAG }}
          path: dist/${{ env.RELEASE_TAG }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'release'
    needs: [runner, test, windows]
    runs-on: ${{ needs.runner.outputs.windows }}
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # publish-release.ps1 validates the tag with cargo metadata.
      - name: Set up Rust
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { throw 'Could not install pinned Rust toolchain.' }
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-${{ env.RELEASE_TAG }}
          path: dist/${{ env.RELEASE_TAG }}
      - name: Attach files to the triggering release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: ./scripts/publish-release.ps1 -Tag $env:RELEASE_TAG -ReleaseId $env:RELEASE_ID
