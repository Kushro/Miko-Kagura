name: Release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to validate, e.g. v0.1.0 (build only; does not publish)'
        required: true
        type: string
      attach:
        description: 'Build the tag and attach the packages to its draft release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # An attach run packages the tagged commit, whatever ref the workflow came from.
  BUILD_REF: ${{ inputs.attach && format('refs/tags/{0}', inputs.tag) || github.sha }}

# Keyed by tag so publishing a draft waits for an attach run on the same tag.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  runner:
    # Every other job needs this one, so skipping it skips the whole release.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/runner.yml

  # Finds the release to attach to (none for a plain dry run) and whether it already
  # has every package, e.g. a draft filled by an attach run and then published.
  release:
    needs: runner
    runs-on: ${{ needs.runner.outputs.linux }}
    timeout-minutes: 5
    # Read-only, but the API lists draft releases only to tokens with push access.
    permissions:
      contents: write
    outputs:
      id: ${{ steps.find.outputs.id }}
      complete: ${{ steps.find.outputs.complete }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_ID: ${{ github.event.release.id }}
      ATTACH: ${{ inputs.attach }}
    steps:
      - id: find
        run: |
          if [ -z "$RELEASE_ID" ]; then
            if [ "$ATTACH" != true ]; then echo complete=false >> "$GITHUB_OUTPUT"; exit 0; fi
            # A draft has no /releases/tags/<tag> URL, so search the list.
            RELEASE_ID=$(gh api --paginate "repos/$GH_REPO/releases" \
              --jq ".[] | select(.draft and .tag_name == \"$RELEASE_TAG\") | .id")
            [ "$(wc -w <<<"$RELEASE_ID")" = 1 ] || { echo "Expected one draft release for $RELEASE_TAG."; exit 1; }
          fi
          # Same eight packages and SHA256SUMS.txt that publish-release.ps1 uploads.
          prefix="Miko-Kagura-$RELEASE_TAG"
          expected=$(printf '%s\n' SHA256SUMS.txt \
            "$prefix-windows-x64-"{portable-lite.zip,portable-full.zip,setup-lite.exe,setup-full.exe} \
            "$prefix-linux-x64-"{portable-lite.tar.gz,portable-full.tar.gz,full.AppImage,full.deb} | sort)
          present=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.assets[].name' | sort)
          if [ -z "$(comm -23 <(echo "$expected") <(echo "$present"))" ]; then
            complete=true
            echo "$RELEASE_TAG already has every package; skipping build and upload." >> "$GITHUB_STEP_SUMMARY"
          else
            complete=false
            immutable=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .immutable)
            [ "$immutable" != true ] || { echo 'Published immutable releases cannot accept new assets.'; exit 1; }
          fi
          { echo "id=$RELEASE_ID"; echo "complete=$complete"; } >> "$GITHUB_OUTPUT"

  test:
    needs: [runner, release]
    if: needs.release.outputs.complete != 'true'
    runs-on: ${{ needs.runner.outputs.windows }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { throw 'Could not install pinned Rust toolchain.' }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-test
          save-if: false
      # Tests do not need optimized dependencies; release packaging keeps its own profile.
      - name: Run tests
        run: |
          cargo test --locked --config "profile.dev.package.'*'.opt-level=0"
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed.' }

  windows:
    needs: [runner, release]
    if: needs.release.outputs.complete != 'true'
    runs-on: ${{ needs.runner.outputs.windows }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { throw 'Could not install pinned Rust toolchain.' }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Validate version and documentation
        run: |
          . ./scripts/release-common.ps1
          Get-ReleaseVersion $env:RELEASE_TAG
          bun run docs:check
          Assert-NativeSuccess 'Documentation checks'
      # Restores the cache that ci.yml (warm-release) saves from main; never saves here.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-release
          save-if: false
      # gh cannot verify api.github.com on Avrea's Windows image (x509: unknown
      # authority); the release files are public, so fetch them over HTTPS directly.
      - name: Install Dioxus CLI 0.7.9
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'dioxus-cli'
          New-Item -ItemType Directory -Force $tools | Out-Null
          foreach ($name in @('dx-x86_64-pc-windows-msvc.zip', 'dx-x86_64-pc-windows-msvc.sha256')) {
              Invoke-WebRequest "https://github.com/DioxusLabs/dioxus/releases/download/v0.7.9/$name" -OutFile (Join-Path $tools $name) -MaximumRetryCount 3 -RetryIntervalSec 5
          }
          $zip = Join-Path $tools 'dx-x86_64-pc-windows-msvc.zip'
          $expected = ((Get-Content "$tools/dx-x86_64-pc-windows-msvc.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $zip).Hash -ine $expected) { throw 'Dioxus checksum mismatch.' }
          Expand-Archive $zip "$tools/bin"
          $dx = @(Get-ChildItem "$tools/bin" -Recurse -Filter dx.exe)
          if ($dx.Count -ne 1) { throw 'Unexpected Dioxus archive layout.' }
          $dx[0].DirectoryName >> $env:GITHUB_PATH
      - name: Build Lite and Full packages
        # Tests run in the parallel test job; publish requires both jobs.
        run: ./scripts/build-release.ps1 -Tag $env:RELEASE_TAG -SkipTests
      - name: Test installation and variant upgrades
        run: ./scripts/test-installers.ps1 -Tag $env:RELEASE_TAG
      - name: Retain packages for inspection and upload retries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-${{ env.RELEASE_TAG }}
          path: dist/${{ env.RELEASE_TAG }}/*
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: [runner, release]
    if: needs.release.outputs.complete != 'true'
    # Avrea Ubuntu 24.04: packages inherit its glibc 2.39 floor, so do not swap
    # this for a newer image without updating the documented requirements.
    runs-on: ${{ needs.runner.outputs.linux }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false
      # The publish job runs publish-release.ps1 on this runner type.
      - name: Check PowerShell for the publish job
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file jq unzip dpkg-dev patchelf libvulkan1 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Set up Rust
        run: rustup show
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      # Restores the cache that ci.yml (warm-release-linux) saves from main; never saves here.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-release
          save-if: false
      - name: Install Dioxus CLI 0.7.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools="$RUNNER_TEMP/dioxus-cli"
          mkdir -p "$tools/bin"
          gh release download v0.7.9 --repo DioxusLabs/dioxus --pattern dx-x86_64-unknown-linux-gnu.zip --pattern dx-x86_64-unknown-linux-gnu.sha256 --dir "$tools"
          # The .sha256 lists both the .tar.gz and the .zip; only the zip was downloaded.
          (cd "$tools" && sha256sum -c --ignore-missing --strict dx-x86_64-unknown-linux-gnu.sha256)
          unzip -q "$tools/dx-x86_64-unknown-linux-gnu.zip" -d "$tools/bin"
          dx=$(find "$tools/bin" -type f -name dx)
          [ "$(wc -l <<<"$dx")" = 1 ] || { echo 'Unexpected Dioxus archive layout.'; exit 1; }
          chmod +x "$dx"
          dirname "$dx" >> "$GITHUB_PATH"
      - name: Build tarballs, AppImage and deb
        # Tests run in the parallel test job; publish requires every job.
        run: bash scripts/build-release-linux.sh "$RELEASE_TAG" --skip-tests
      - name: Test packages on Ubuntu and Arch
        run: bash scripts/test-linux-packages.sh "$RELEASE_TAG" "$RUNNER_TEMP/aur"
      - name: Retain packages for inspection and upload retries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x64-${{ env.RELEASE_TAG }}
          path: dist/${{ env.RELEASE_TAG }}-linux/*
          if-no-files-found: error
          retention-days: 14
      # Not a release asset: copy these to the AUR repository (see docs/en/releasing.md).
      - name: Retain the tested AUR PKGBUILD
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aur-miko-kagura-bin-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/aur/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  publish:
    if: needs.release.outputs.id != '' && needs.release.outputs.complete != 'true'
    needs: [runner, release, test, windows, linux]
    # Linux: gh cannot verify api.github.com on Avrea's Windows image.
    runs-on: ${{ needs.runner.outputs.linux }}
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # publish-release.ps1 validates the tag with cargo metadata.
      - name: Set up Rust
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { throw 'Could not install pinned Rust toolchain.' }
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-${{ env.RELEASE_TAG }}
          path: dist/${{ env.RELEASE_TAG }}
      - name: Download Linux packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-x64-${{ env.RELEASE_TAG }}
          path: dist/${{ env.RELEASE_TAG }}-linux
      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.release.outputs.id }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' }}
        run: ./scripts/publish-release.ps1 -Tag $env:RELEASE_TAG -ReleaseId $env:RELEASE_ID -Draft:($env:DRAFT -eq 'true')
