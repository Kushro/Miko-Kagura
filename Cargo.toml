[package]
name = "miko-kagura"
version = "0.1.0"
edition = "2021"
description = "Miko's remote image upscaling companion with a Dioxus desktop dashboard."
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Kushro/Miko-Kagura"

[dependencies]
dioxus = { version = "0.7.9", features = ["desktop"] }

# HTTP server
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tower-http = { version = "0.5", features = ["cors", "limit"] }

# Image handling
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"

# PNG lossless compression
oxipng = "9"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# HTTP client for server-side image downloads (URL endpoints)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Native folder picker for the Settings → Binary Directory control
rfd = "0.17"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
